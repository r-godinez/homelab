---
- name: Install dependencies
  apt:
    name: curl
    state: present
    update_cache: yes

- name: Disable swap
  command: swapoff -a
  when: ansible_swaptotal_mb > 0

- name: Remove swap from fstab
  replace:
    path: /etc/fstab
    regexp: '^([^#].*\sswap\s+sw\s+.*)$'
    replace: '# \1'

# Wait until master exposes API
- name: Wait for master API
  wait_for:
    host: "{{ hostvars[groups['k3s_server'][0]].node_ip }}"
    port: 6443
    timeout: 120

- name: Install K3s worker
  shell: |
    curl -sfL https://get.k3s.io | \
    K3S_URL=https://{{ hostvars[groups['k3s_server'][0]].node_ip }}:6443 \
    K3S_TOKEN={{ hostvars[groups['k3s_server'][0]].k3s_token }} \
    INSTALL_K3S_EXEC="--node-ip {{ node_ip }}" sh -
  args:
    creates: /usr/local/bin/k3s-worker

- name: Verify node joined
  shell: kubectl get nodes | grep $(hostname)
  delegate_to: "{{ groups['k3s_server'][0] }}"
  register: node_check
  retries: 10
  delay: 5
  until: node_check.rc == 0