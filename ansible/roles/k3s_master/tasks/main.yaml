---
- name: Install dependencies
  apt:
    name: curl
    state: present
    update_cache: yes

- name: Disable swap
  command: swapoff -a
  when: ansible_swaptotal_mb > 0

- name: Remove swap from fstab
  replace:
    path: /etc/fstab
    regexp: '^([^#].*\sswap\s+sw\s+.*)$'
    replace: '# \1'

- name: Install K3s server
  shell: |
    curl -sfL https://get.k3s.io | INSTALL_K3S_EXEC="--node-ip {{ node_ip }} --advertise-address {{ node_ip }} --write-kubeconfig-mode=644" sh -
  args:
    creates: /usr/local/bin/k3s

- name: Wait for K3s API
  wait_for:
    port: 6443
    host: "{{ node_ip }}"
    delay: 5
    timeout: 120

- name: Get node token
  command: cat /var/lib/rancher/k3s/server/node-token
  register: k3s_token_raw

- name: Set global token fact
  set_fact:
    k3s_token: "{{ k3s_token_raw.stdout }}"