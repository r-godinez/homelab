# Ansible Lint Pipeline

name: Ansible CI

on:
    push:
        branches:
            - main
    pull_request:

jobs:
    ansible:
        runs-on: ubuntu-latest

        defaults:
            run:
                working-directory: ansible
            
        steps:
            - name: Checkout
              uses: actions/checkout@v4
            
            - name: Install Asnible
              run: |
                python -m pip install --upgrade pip
                pip install ansible ansible-lint yamlint

            - name: Run YAML Lint
              run: yamllint ansible/

            - name: Run Ansible Lint
              run: ansible-lint ansible/